name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n *.hook 2>/dev/null || true
      - run: |
          for f in *.hook; do bash -n "$f"; done
          echo "hooks syntax verified"
